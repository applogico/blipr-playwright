name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please runs as the applogico-release GitHub App so its API commits are signed.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # When a release is cut, build and publish @blipr/playwright to npm using npm's
      # Trusted Publisher (OIDC) — no NPM_TOKEN. Authentication and provenance
      # come from the GitHub OIDC token (needs id-token: write, above).
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing (OIDC) requires npm >= 11.5.1; npm@latest needs Node 22.22+.
      - name: Upgrade npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest
      - name: Install
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci
      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build
      - name: Stage on npm (approve on npmjs.com to publish)
        if: ${{ steps.release.outputs.release_created }}
        run: npm stage publish --access public

      - name: Announce the release
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        uses: applogico/blipr-action@v1
        with:
          topic: blipr-releases
          title: "@blipr/playwright ${{ steps.release.outputs.tag_name }} released"
          message: "npm i -D @blipr/playwright"
          priority: 3
          tags: package
          click: ${{ steps.release.outputs.html_url }}

      - name: Blip when the release fails
        if: ${{ failure() }}
        uses: applogico/blipr-action@v1
        with:
          topic: blipr-releases
          title: "@blipr/playwright release failed"
          message: "The release workflow failed. Nothing reached npm."
          priority: 4
          tags: x
          click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
